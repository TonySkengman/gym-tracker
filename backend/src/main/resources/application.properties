spring.application.name=gym-tracker
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gym_tracker}
spring.datasource.username=${DB_USERNAME:gym}
spring.datasource.password=${DB_PASSWORD:gym_local_dev}
# Convenient for the first milestone. Replace with migrations before production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.address=127.0.0.1
server.error.include-message=never
# Session cookies remain unreadable to JavaScript; production HTTPS enables Secure.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
